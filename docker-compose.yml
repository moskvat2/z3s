services:
  z3s-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: z3s/server:latest
    container_name: z3s-server
    restart: unless-stopped
    ports:
      - "${Z3S_PORT:-9000}:9000"
    environment:
      - Z3S_BIND=0.0.0.0:9000
      - Z3S_DATA_DIR=/data
      - Z3S_ACCESS_KEY=${Z3S_ACCESS_KEY:-Z3SACCESSKEYEXAMPLE}
      - Z3S_SECRET_KEY=${Z3S_SECRET_KEY:-Z3SSECRETKEYEXAMPLE1234567890ABCDEF}
      - Z3S_DATA_SHARDS=${Z3S_DATA_SHARDS:-4}
      - Z3S_PARITY_SHARDS=${Z3S_PARITY_SHARDS:-2}
    volumes:
      - z3s_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

volumes:
  z3s_data:
    driver: local
